# מעדכן את rates.json (שער יציג של בנק ישראל) פעם ביום, בימים א'-ו' בערב.
name: update rates
on:
  schedule:
    - cron: "30 15 * * 0-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_rates.py
      - run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "עדכון שערים"
          git push
